# Triangle (C), Tessera, Orogen and the lab (Odin), on macOS and Linux; Triangle on
# Windows too. What each platform needs is in ci/README.md.
name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Odin
        run: sh ci/install-odin.sh "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: Triangle
        run: make -C triangle test cli-test lsp-test odin
      - name: Tessera
        if: ${{ !cancelled() }}
        run: make -C tessera test check
      - name: Orogen
        if: ${{ !cancelled() }}
        run: make -C orogen test check
      - name: Lab
        if: ${{ !cancelled() }}
        run: make -C lab check

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain image
        run: docker build -t bruggadung ci
      - name: Triangle
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung make -C triangle CC=clang test cli-test lsp-test odin
      - name: Tessera
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung make -C tessera test check
      - name: Orogen
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung make -C orogen test check
      - name: Lab
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung make -C lab check

  # Odin links for the MSVC ABI on Windows; the lab and Tessera aren't built
  # there yet (triangle/Makefile's odin-lib has the untried MSVC build).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
      - name: Toolchain
        run: sh ci/windows/setup-msys2.sh
      - name: Triangle
        run: make -C triangle CC=clang test cli-test lsp-test
