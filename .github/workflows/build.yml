# The lab and Triangle on macOS, Linux and Windows (lab/ci/README.md).
name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Triangle
        run: make -C triangle test cli-test lsp-test
      - name: Lab
        run: make -C lab check
      # Odin: Tessera, and the spike (lab/odin/spike). In this job, not one
      # of its own: a second macOS job waited for a runner and was dropped.
      - name: Odin
        run: sh lab/ci/odin/install-odin.sh "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: Tessera and the Odin spike
        run: make -C tessera test && make -C triangle odin && make -C lab odin-spike

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain image
        run: docker build -t bruggadung-lab lab/ci/linux
      - name: Triangle
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung-lab make -C triangle CC=clang test cli-test lsp-test
      - name: Lab
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung-lab make -C lab check
      - name: Tessera and the Odin spike
        run: |
          docker build -t bruggadung-odin lab/ci/odin
          docker run --rm -v "$PWD":/repo -w /repo bruggadung-odin sh -c 'make -C tessera test && make -C triangle odin && make -C lab odin-spike'

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
      - name: Toolchain
        run: sh lab/ci/windows/setup-msys2.sh
      - name: Triangle
        run: make -C triangle CC=clang test cli-test lsp-test
      - name: Lab
        run: make -C lab check

