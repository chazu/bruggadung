# Triangle (C), Tessera, Orogen and the lab (Odin), on macOS and Linux; Triangle on
# Windows too. What each platform needs is in ci/README.md.
#
# Each part is a job of its own, the root Makefile's check-<part> (make check
# runs them all), so that one part's failure doesn't hide another's. Linux runs
# make asan as a job too.
name: build

on:
  push:
  pull_request:

jobs:
  macos:
    name: macos (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [check-triangle, check-tessera, check-orogen, check-lab]
    steps:
      - uses: actions/checkout@v4
      - name: Odin
        run: sh ci/install-odin.sh "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [check-triangle, check-tessera, check-orogen, check-lab, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain image
        run: docker build -t bruggadung ci
      - name: make ${{ matrix.target }}
        run: docker run --rm -v "$PWD":/repo -w /repo bruggadung make CC=clang ${{ matrix.target }}

  # Odin links for the MSVC ABI on Windows; the lab and Tessera aren't built
  # there yet (triangle/Makefile's odin-lib has the untried MSVC build).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
      - name: Toolchain
        run: sh ci/windows/setup-msys2.sh
      - name: Triangle
        run: make -C triangle CC=clang test cli-test lsp-test
